<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div class="column">
                <h3>HOME</h3>
                <h2 class="score" id="homeScore">0</h2>
                <button onclick="home1()">+1</button>
                <button onclick="home2()">+2</button>
                <button onclick="home3()">+3</button>
            </div>
            
            <div class="column">
            
                <h3>&nbsp</h3>   
                <h2 class="gameTime" id="gameTime">00:00:00</h2>
                    <div class="row">
                        <button id="startGame">start</button>
                        <button id="stopGame">stop</button>
                        <button id="resetGame">reset</button>
                     </div>
            </div>
            <div class="column">
                <h3>AWAY</h3>   
                <h2 class="score" id="guestScore">0</h2>
                    <div class="row">
                        <button onclick="guest1()">+1</button>
                        <button onclick="guest2()">+2</button>
                        <button onclick="guest3()">+3</button></div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
